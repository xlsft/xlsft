name: cv-xlsft-com

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-twenty-env: &twenty-env
  SERVER_URL: https://crm.xlsft.com
  PG_DATABASE_URL: postgres://twenty:${TWENTY_DB_PASSWORD}@twenty-db:5432/twenty
  REDIS_URL: redis://twenty-redis:6379
  STORAGE_TYPE: local
  ENCRYPTION_KEY: ${TWENTY_ENCRYPTION_KEY}

services:
  app:
    image: ghcr.io/xlsft/xlsft:${APP_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    logging: *logging
    environment:
      NUXT_CLARITY_TOKEN: ${NUXT_CLARITY_TOKEN}
      NUXT_GITHUB_TOKEN: ${NUXT_GITHUB_TOKEN}
      NUXT_TWENTY_URL: http://twenty:3000
      NUXT_TWENTY_TOKEN: ${TWENTY_API_KEY:-}
      NUXT_HCAPTCHA_SECRET: ${NUXT_HCAPTCHA_SECRET}
      NUXT_DEEPSEEK_TOKEN: ${NUXT_DEEPSEEK_TOKEN}
      NUXT_AI_SECRET: ${NUXT_AI_SECRET}
      NUXT_SEARXNG_URL: http://searxng:8080
    volumes:
      - app-data:/app/.data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    depends_on:
      searxng:
        condition: service_started
    networks:
      - default
      - traefik
    labels:
      traefik.enable: "true"
      traefik.docker.network: traefik
      traefik.http.routers.cv.rule: Host(`cv.xlsft.com`)
      traefik.http.routers.cv.priority: "10"
      traefik.http.routers.cv.entrypoints: websecure
      traefik.http.routers.cv.tls.certresolver: letsencrypt
      traefik.http.services.cv.loadbalancer.server.port: "3000"

  clarity:
    logging: *logging
    image: crumbleerp/clarity:40c71ad@sha256:dd4e211980ae420a9c82c5c6dc2795be46014caf9b2f14373d291c9b796198e2
    restart: unless-stopped
    environment:
      NUXT_APP_BASE_URL: /content/
      NUXT_DATABASE_URL: postgresql://clarity:${POSTGRES_PASSWORD}@postgres:5432/clarity
      NUXT_PUBLIC_DATASET: cv
      NUXT_PUBLIC_API_BASE_URL: https://cv.xlsft.com/content
      NUXT_ROOT_USERNAME: admin
      NUXT_ROOT_PASSWORD: ${CLARITY_ROOT_PASSWORD}
      NUXT_SESSION_SECRET: ${CLARITY_SESSION_SECRET}
      NUXT_CORS_ORIGINS: https://cv.xlsft.com
      NUXT_S3_ENDPOINT: https://s3.ru1.storage.beget.cloud
      NUXT_S3_REGION: ru1
      NUXT_S3_BUCKET: 3f3deb6e7eb1-cv-xlsft-ru
      NUXT_S3_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      NUXT_S3_SECRET_KEY: ${STORAGE_SECRET_KEY}
      NUXT_S3_PUBLIC_URL: https://s3.ru1.storage.beget.cloud/3f3deb6e7eb1-cv-xlsft-ru
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
      - traefik
    labels:
      traefik.enable: "true"
      traefik.docker.network: traefik
      traefik.http.routers.cv-content.rule: Host(`cv.xlsft.com`) && (Path(`/content`) || PathPrefix(`/content/`))
      traefik.http.routers.cv-content.priority: "100"
      traefik.http.routers.cv-content.entrypoints: websecure
      traefik.http.routers.cv-content.tls.certresolver: letsencrypt
      traefik.http.routers.cv-content.service: cv-content
      traefik.http.services.cv-content.loadbalancer.server.port: "3000"

  postgres:
    logging: *logging
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: clarity
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: clarity
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clarity -d clarity"]
      interval: 3s
      timeout: 5s
      retries: 20

  searxng:
    logging: *logging
    image: searxng/searxng:latest
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET}
      SEARXNG_BASE_URL: http://searxng:8080/
    volumes:
      - ./config/searxng.yml:/etc/searxng/settings.yml:ro

  twenty:
    logging: *logging
    image: twentycrm/twenty:${TWENTY_TAG:-v2.63.0}
    restart: unless-stopped
    stop_grace_period: 120s
    environment:
      <<: *twenty-env
      NODE_PORT: 3000
    volumes:
      - twenty-storage:/app/packages/twenty-server/.local-storage
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:3000/healthz"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 20
    depends_on:
      twenty-db:
        condition: service_healthy
      twenty-redis:
        condition: service_healthy
    networks:
      - default
      - traefik
    labels:
      traefik.enable: "true"
      traefik.docker.network: traefik
      traefik.http.routers.crm.rule: Host(`crm.xlsft.com`)
      traefik.http.routers.crm.entrypoints: websecure
      traefik.http.routers.crm.tls.certresolver: letsencrypt
      traefik.http.routers.crm.service: crm
      traefik.http.services.crm.loadbalancer.server.port: "3000"
      # Twenty не поддерживает подпуть, поэтому /admin только ведёт на его хост
      traefik.http.routers.cv-admin.rule: Host(`cv.xlsft.com`) && (Path(`/admin`) || PathPrefix(`/admin/`))
      traefik.http.routers.cv-admin.priority: "100"
      traefik.http.routers.cv-admin.entrypoints: websecure
      traefik.http.routers.cv-admin.tls.certresolver: letsencrypt
      traefik.http.routers.cv-admin.service: crm
      traefik.http.routers.cv-admin.middlewares: cv-admin
      traefik.http.middlewares.cv-admin.redirectregex.regex: ^https?://cv\.xlsft\.com/admin(.*)
      traefik.http.middlewares.cv-admin.redirectregex.replacement: https://crm.xlsft.com$${1}

  twenty-worker:
    logging: *logging
    image: twentycrm/twenty:${TWENTY_TAG:-v2.63.0}
    restart: unless-stopped
    command: ["yarn", "worker:prod"]
    environment:
      <<: *twenty-env
      DISABLE_DB_MIGRATIONS: "true"
      DISABLE_CRON_JOBS_REGISTRATION: "true"
    volumes:
      - twenty-storage:/app/packages/twenty-server/.local-storage
    depends_on:
      twenty:
        condition: service_healthy

  twenty-db:
    logging: *logging
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: twenty
      POSTGRES_PASSWORD: ${TWENTY_DB_PASSWORD}
      POSTGRES_DB: twenty
    volumes:
      - twenty-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U twenty -d twenty"]
      interval: 5s
      timeout: 5s
      retries: 20

  twenty-redis:
    logging: *logging
    image: redis:8-alpine
    restart: unless-stopped
    command: ["--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  app-data:
  postgres-data:
  twenty-db-data:
  twenty-storage:

networks:
  traefik:
    external: true
    name: traefik
