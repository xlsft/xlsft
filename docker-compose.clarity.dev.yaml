name: xlsft-clarity-dev

services:
  clarity:
    image: crumbleerp/clarity:latest
    ports:
      - "127.0.0.1:3001:3000"
    env_file: .env.clarity.local
    environment:
      NUXT_DATABASE_URL: postgresql://clarity:clarity@postgres:5432/clarity
      NUXT_PUBLIC_DATASET: cv
      NUXT_PUBLIC_API_BASE_URL: http://localhost:3001
      NUXT_CORS_ORIGINS: http://localhost:3000,http://localhost:3035
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: clarity
      POSTGRES_PASSWORD: clarity
      POSTGRES_DB: clarity
    volumes:
      - clarity-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clarity -d clarity"]
      interval: 2s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  searxng:
    # веб-поиск ассистента в dev: приложение по умолчанию ходит на 127.0.0.1:8888
    image: searxng/searxng:latest
    ports:
      - "127.0.0.1:8890:8080"
    environment:
      SEARXNG_SECRET: dev-searxng-secret
    volumes:
      - ./deploy/searxng/settings.yml:/etc/searxng/settings.yml:ro
    restart: unless-stopped

volumes:
  clarity-data:
